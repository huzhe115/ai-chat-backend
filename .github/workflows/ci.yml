name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install . pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
        env:
          # conftest 里的测试配置:连 CI 的 postgres 服务,Redis/MQ/LLM 走降级路径
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_chat_test
