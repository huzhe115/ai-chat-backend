[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "ai-chat-backend"
version = "0.1.0"
description = "AI 聊天应用后端:FastAPI + PostgreSQL + Redis + RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "aio-pika>=9.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI 依赖注入的标准写法就是 Depends() 放参数默认值,官方文档如此
# BLE001: Redis/MQ/LLM 等外部依赖的失败边界必须宽捕获并降级,这里宽捕获是刻意的
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 所有异步测试共用一个事件循环,否则 asyncpg 连接池跨循环复用会报
# "another operation is in progress" / "attached to a different loop"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
